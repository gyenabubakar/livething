# CI gate for pull requests and pushes to main.
#
# Security: `pull_request` (not `pull_request_target`) → fork PRs run with a
# read-only token and no secret access. No secrets are used here, and actions
# are pinned to commit SHAs. Never interpolate untrusted input into `run:`.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint:check

      - name: Unit tests
        run: pnpm test

  e2e:
    name: e2e (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The official Playwright image ships chromium + OS deps prebaked, so there
    # is no browser download to stall on. The image tag MUST match the pinned
    # @playwright/test version (tests-e2e/client-raw/package.json) so the
    # bundled browser revision is the one the runner expects.
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      # The image bundles an older Node; pin to the repo's required major.
      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # One step per adapter (node/deno/bun to come). The client-library suite
      # is adapter-independent and runs once.
      - name: e2e — client library
        run: pnpm test:e2e:client

      - name: e2e — cloudflare adapter
        run: pnpm test:e2e:cloudflare

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: |
            tests-e2e/client/playwright-report/
            tests-e2e/client-raw/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

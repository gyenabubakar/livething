# CI gate for pull requests and direct pushes to main.
#
# Security: `pull_request` (not `pull_request_target`) → fork PRs run with a
# read-only token and no secret access. No secrets are used here, and actions
# are pinned to commit SHAs. Never interpolate untrusted input into `run:`.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Decide whether CI is needed
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.filter.outputs.should_run }}
    steps:
      - id: filter
        name: Skip merged pull request pushes
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          if [[ "$EVENT_NAME" != "push" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! merged_pr="$(gh api \
            "/repos/${REPOSITORY}/commits/${SHA}/pulls" \
            --jq 'any(.[]; .merged_at != null)')"; then
            echo "::warning::Could not check whether this push came from a merged pull request; running CI."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$merged_pr" == "true" ]]; then
            echo "This push is a merged pull request; skipping duplicate CI."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "This is a direct push; running CI."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

  checks:
    name: Checks + unit tests
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint:check

      - name: Unit tests
        run: pnpm test

  # Architecture guards, kept separate from the fast checks so a tree-shaking
  # regression is easy to spot. `depcruise` reads source; `dup` scans source;
  # `bundle-check` inspects the built server/client dist, so this job builds the
  # packages first.
  guards:
    name: Architecture guards
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Duplication check
        run: pnpm dup

      - name: Dependency rules
        run: pnpm depcruise

      - name: Bundle / tree-shaking check
        run: pnpm bundle-check

  e2e:
    name: e2e (Playwright) — ${{ matrix.name }}
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The official Playwright image ships chromium + OS deps prebaked, so there
    # is no browser download to stall on. The image tag MUST match the pinned
    # @playwright/test version (tests-e2e/client-raw/package.json) so the
    # bundled browser revision is the one the runner expects.
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
    strategy:
      fail-fast: false
      # One job per adapter (node/deno/bun to come), run concurrently so
      # calendar time is the slowest suite, not the sum of all three.
      matrix:
        include:
          - name: client-puppet
            command: pnpm test:e2e:client-puppet
            report-path: |
              tests-e2e/client/playwright-report/
              tests-e2e/client/test-results/
          - name: cloudflare-raw
            command: pnpm --filter @wskit/tests-e2e-server-cloudflare run test:e2e:cloudflare
            report-path: |
              tests-e2e/client-raw/playwright-report/
              tests-e2e/client-raw/test-results/
          - name: cloudflare-packaged
            command: pnpm --filter @wskit/tests-e2e-client run test:e2e:cloudflare
            report-path: |
              tests-e2e/client/playwright-report/
              tests-e2e/client/test-results/
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      # The image bundles an older Node; pin to the repo's required major.
      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: e2e — ${{ matrix.name }}
        run: ${{ matrix.command }}

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report-${{ matrix.name }}
          path: ${{ matrix.report-path }}
          retention-days: 7
          if-no-files-found: ignore

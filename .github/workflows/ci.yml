# CI gate for pull requests and pushes to main.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Checks + tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint:check

      - name: Unit tests
        run: pnpm test:unit

      # e2e runs last so the fast checks above fail first and save runner
      # minutes. Browsers are installed only for this step.
      - name: Resolve Playwright version
        id: pw
        run: echo "v=$(pnpm --filter @wskit/tests-e2e-cloudflare exec node -p 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browser
        id: pw-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.v }}

      # The chromium download from cdn.playwright.dev can stall at 100% on CI
      # (the connection never closes), which otherwise hangs until the job
      # timeout. Bound each attempt and retry; once it succeeds the cache lets
      # later runs skip the download. --with-deps (apt libs) only on a miss.
      - name: Install Playwright browser
        run: |
          args="${{ steps.pw-cache.outputs.cache-hit == 'true' && 'chromium' || '--with-deps chromium' }}"
          for i in 1 2 3; do
            timeout 300 pnpm --filter @wskit/tests-e2e-cloudflare exec playwright install $args && exit 0
            echo "::warning::playwright install attempt $i stalled or failed; retrying"
          done
          exit 1

      - name: e2e tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: tests-e2e/cloudflare/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

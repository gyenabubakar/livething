# The middleboxes that sit between real users and a LiveThing server: reverse proxies, TLS
# intercepting proxies and a bad network. Each one has its own profile, so the lane starts one at
# a time. The LiveThing server runs on the host (src/server.ts), on port 8443, as livething.test.
#
#   docker compose --profile nginx up -d       # reverse proxy: tuned on 9443, stock on 9444
#   docker compose --profile toxiproxy up -d   # TCP proxy on 9445 that adds delay and cuts
#   docker compose --profile mitmproxy up -d   # TLS intercepting forward proxies: 8080 holds
#                                              # whole bodies, 8081 streams them
#   docker compose --profile squid up -d       # TLS intercepting forward proxy on 3128, HTTP/1.1
name: livething-middleboxes

x-host: &host
  extra_hosts:
    - livething.test:host-gateway
    - host.docker.internal:host-gateway

services:
  nginx:
    profiles: [nginx]
    image: nginx:1.27-alpine
    <<: *host
    ports: ['9443:9443', '9444:9444']
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/certs:ro

  toxiproxy:
    profiles: [toxiproxy]
    image: ghcr.io/shopify/toxiproxy:2.12.0
    <<: *host
    ports: ['8474:8474', '9445:9445']

  mitmproxy:
    profiles: [mitmproxy]
    image: mitmproxy/mitmproxy:11.1.3
    <<: *host
    ports: ['8080:8080']
    # Its stock settings: it reads each request and each response whole before it passes it on.
    command: mitmdump --listen-host 0.0.0.0 --listen-port 8080 --ssl-insecure

  mitmproxy-streaming:
    profiles: [mitmproxy]
    image: mitmproxy/mitmproxy:11.1.3
    <<: *host
    ports: ['8081:8081']
    # Passes every body on as it arrives, as most intercepting proxies do.
    command: >-
      mitmdump --listen-host 0.0.0.0 --listen-port 8081 --ssl-insecure
      --set stream_large_bodies=1

  squid:
    profiles: [squid]
    build: ./squid
    <<: *host
    ports: ['3128:3128']

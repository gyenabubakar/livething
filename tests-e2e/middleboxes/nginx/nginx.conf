# 9443: nginx set up as the Transports page says, so WebSocket and stream mode get through.
server {
  listen 9443 ssl;
  http2 on;
  server_name livething.test;
  ssl_certificate /certs/server.crt;
  ssl_certificate_key /certs/server.key;

  location / {
    proxy_pass https://host.docker.internal:8443;
    proxy_ssl_verify off;
    proxy_http_version 1.1;
    proxy_set_header Host $host:$server_port;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_buffering off;
    proxy_request_buffering off;
    client_max_body_size 0;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }
}

# 9444: nginx with only a proxy_pass, as many sites start. It drops the Upgrade header, so
# WebSocket fails, and it reads each request body whole, so the long POST never streams.
server {
  listen 9444 ssl;
  http2 on;
  server_name livething.test;
  ssl_certificate /certs/server.crt;
  ssl_certificate_key /certs/server.key;

  location / {
    proxy_pass https://host.docker.internal:8443;
    proxy_ssl_verify off;
  }
}

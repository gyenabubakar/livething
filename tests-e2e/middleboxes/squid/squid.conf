# Opens every TLS connection and reads the HTTP inside, as a company proxy does.
http_port 3128 ssl-bump generate-host-certificates=on dynamic_cert_mem_cache_size=4MB tls-cert=/etc/squid/ssl/ca.pem
sslcrtd_program /usr/lib/squid/security_file_certgen -s /var/spool/squid/ssl_db -M 4MB
acl step1 at_step SslBump1
ssl_bump peek step1
ssl_bump bump all
# The test server has its own CA, which Squid does not know.
tls_outgoing_options flags=DONT_VERIFY_PEER
http_access allow all
cache deny all
# Squid runs as `proxy`, which may not write to the container's stdout. Read the logs with
# `docker compose exec squid cat /var/log/squid/access.log`.
access_log stdio:/var/log/squid/access.log
cache_log /var/log/squid/cache.log

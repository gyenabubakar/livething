packages:
  - client
  - core
  - server
  - server-adapters/*
  - plugins/*
  - tests-e2e/*
  - website

allowBuilds:
  '@parcel/watcher': true
  better-sqlite3: true
  esbuild: true
  msw: true
  sharp: true
  vue-demi: true
  workerd: true

packageExtensions:
  '@nuxt/content@3.14.0':
    dependencies:
      h3: ^1.15.11
  'nuxt-og-image@6.6.0':
    dependencies:
      h3: ^1.15.11
  'nuxt-llms@0.2.0':
    dependencies:
      h3: ^1.15.11
